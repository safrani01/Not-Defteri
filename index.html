*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none}

.ic{flex:none;display:block}

#main{flex:1;overflow-y:auto;padding:4px 12px 110px;-webkit-overflow-scrolling:touch}
.card,.fchip,.frow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fchip.dt-b{box-shadow:-6px 0 0 var(--primary),0 6px 18px rgba(0,0,0,.22)}.fchip.dt-a{box-shadow:6px 0 0 var(--primary),0 6px 18px rgba(0,0,0,.22)}

.card{break-inside:avoid;margin:0 0 10px;border-radius:16px;padding:12px 13px;background:var(--n0);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}

.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}

.btn{background:var(--primary);color:var(--on-primary);border-radius:22px;padding:11px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}

/* ============ Veritabanı (IndexedDB — sınırsız uzunlukta metin) ============ */
let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('notdefteri',1);r.onupgradeneeded=()=>{const d=r.result;['notes','folders','files'].forEach(n=>d.createObjectStore(n,{keyPath:'id'}));d.createObjectStore('blobs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(s,m)=>db.transaction(s,m||'readonly').objectStore(s);
const rq=q=>new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbAll=s=>rq(st(s).getAll());
const idbPut=(s,v,k)=>rq(k===undefined?st(s,'readwrite').put(v):st(s,'readwrite').put(v,k));
const idbGet=(s,k)=>rq(st(s).get(k));
const idbDel=(s,k)=>rq(st(s,'readwrite').delete(k));

let q='',selecting=false,sel=new Set();
const folderById=id=>folders.find(f=>f.id===id&&!f.deleted);

const putFolder=f=>{f.updated=Date.now();idbPut('folders',f);syncSoon()};
const putFile=f=>{f.updated=Date.now();idbPut('files',f);syncSoon()};

/* ============ Arayüz yardımcıları ============ */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
let sheetCancel=null;
function sheet(html,mount){const h=$('#sheetHost');h.innerHTML=`<div class="scrim2" data-close></div><div class="sheet">${html}</div>`;h.classList.add('on');h.onclick=e=>{if(e.target.hasAttribute('data-close')){const c=sheetCancel;closeSheet();c&&c()}};if(mount)mount(h.querySelector('.sheet'))}

function menu(title,items){sheet((title?`<h3>${esc(title)}</h3>`:'')+`<div class="mlist">${items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'danger':''}">${it.ic?ic(it.ic,22):''}<span>${esc(it.label)}</span></button>`).join('')}</div>`,s=>s.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{closeSheet();items[+b.dataset.i].fn()}))}
function ask(title,val,ph){return new Promise(res=>{sheet(`<h3>${esc(title)}</h3><input id="askIn" class="inp" value="${esc(val||'')}" placeholder="${esc(ph||'')}"><div class="row end"><button class="btn ghost" id="askNo">Vazgeç</button><button class="btn" id="askOk">Tamam</button></div>`,s=>{const i=s.querySelector('#askIn');setTimeout(()=>{i.focus();i.select()},60);sheetCancel=()=>res(null);const ok=()=>{closeSheet();res(i.value.trim())};s.querySelector('#askOk').onclick=ok;s.querySelector('#askNo').onclick=()=>{closeSheet();res(null)};i.onkeydown=e=>{if(e.key==='Enter')ok()}})})}
function confirmBox(msg,label){return new Promise(res=>{sheet(`<h3>${esc(msg)}</h3><div class="row end"><button class="btn ghost" id="cNo">Vazgeç</button><button class="btn dng" id="cOk">${esc(label||'Sil')}</button></div>`,s=>{sheetCancel=()=>res(false);s.querySelector('#cOk').onclick=()=>{closeSheet();res(true)};s.querySelector('#cNo').onclick=()=>{closeSheet();res(false)}})})}
function pickFolder(title,cb,allowNone){const fs=folders.filter(f=>!f.deleted).sort((a,b)=>a.name.localeCompare(b.name,'tr'));menu(title,[...(allowNone?[{ic:'notes',label:'Klasörsüz',fn:()=>cb(null)}]:[]),...fs.map(f=>({ic:'folder',label:f.name,fn:()=>cb(f.id)})),{ic:'add',label:'Yeni klasör…',fn:async()=>{const n=await ask('Yeni klasör adı','','Örn. Destanlaşan Hayatlar');if(n){const f=newFolder(n);cb(f.id)}}}])}

/* ============ Klasör işlemleri ============ */
function newFolder(name){const f={id:uid(),name,color:folders.filter(x=>!x.deleted).length%8,pinned:false,created:Date.now(),updated:Date.now()};folders.push(f);putFolder(f);return f}
const countIn=id=>notes.filter(n=>!n.deleted&&n.state==='active'&&n.folderId===id).length;

/* ============ Çizim ============ */
const ord=x=>x.order==null?-1e15:x.order;
const folderSort=(a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||((a.order==null?1e9:a.order)-(b.order==null?1e9:b.order))||a.name.localeCompare(b.name,'tr');
function sortList(l){const k=S.sort;return l.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(k==='manual'?(ord(a)-ord(b))||b.updated-a.updated:k==='title'?(a.title||'').localeCompare(b.title||'','tr'):k==='created'?b.created-a.created:b.updated-a.updated))}
function visibleNotes(){let l=notes.filter(n=>!n.deleted);
 if(q){const t=q.toLocaleLowerCase('tr');l=l.filter(n=>n.state!=='trash'&&((n.title||'')+' '+n.body).toLocaleLowerCase('tr').includes(t))}
 else if(view.scope==='archive')l=l.filter(n=>n.state==='archive');
 else if(view.scope==='trash')l=l.filter(n=>n.state==='trash');
 else if(view.scope==='remind')l=l.filter(n=>n.state==='active'&&n.remind);
 else{l=l.filter(n=>n.state==='active');if(view.scope==='folder')l=l.filter(n=>n.folderId===view.folderId)}

function cardHtml(n){const f=n.folderId&&folderById(n.folderId);const showF=f&&view.scope!=='folder';const ni=imgsOf(n.id).length,na=audOf(n.id).length;
 return `<div class="card ${sel.has(n.id)?'sel':''}" data-act="note" data-id="${n.id}" style="background:${NC[n.color||0]}">${n.pinned?`<span class="pinm">${ic('pin',16)}</span>`:''}<span class="ck">${ic('check',16)}</span>${n.title?`<h4>${esc(n.title)}</h4>`:''}<p>${esc((n.body||'').slice(0,400))}</p><div class="meta">${showF?`<span class="badge">${esc(f.name)}</span>`:''}${n.remind?remBadge(n):''}<span>${fdate(n.updated)}</span>${ni?`<span class="badge">Resim ${ni}</span>`:''}${na?`<span class="badge">Ses ${na}</span>`:''}${view.scope==='remind'&&isDue(n)?`<button class="badge due" data-act="rdone" data-id="${n.id}">Tamam</button>`:''}</div></div>`}

  const nf=files.filter(x=>!x.deleted&&x.folderId===f.id).length;
  h+=`<div class="fhead"><div class="fdot" style="background:${fcol(f)}"></div><h2>${esc(f.name)}</h2><button class="icb" data-act="fmenu">${ic('more')}</button></div><div class="tabs"><button class="${view.tab==='notes'?'on':''}" data-act="tab" data-v="notes">Notlar (${countIn(f.id)})</button><button class="${view.tab==='files'?'on':''}" data-act="tab" data-v="files">Dosyalar (${nf})</button></div>${view.tab==='all'?'<div class="hint" style="margin-top:-6px">Notlar ve dosyalar birlikte gösteriliyor. Yalnız birini görmek için yukarıdan dokunun; tekrar dokununca hepsi görünür.</div>':''}`}
 else if(view.scope==='all'){h+=remBanner()+backupBanner();const fs=folders.filter(f=>!f.deleted).sort(folderSort);
  h+=`<div class="fchips">${fs.map(f=>`<button class="fchip" data-act="folder" data-id="${f.id}" style="${chipStyle(f)}">${f.pinned?`<span class="pn">${ic('pin',13)}</span>`:''}<span>${esc(f.name)}</span><small>${countIn(f.id)} not</small></button>`).join('')}<button class="fchip add" data-act="newfolder">${ic('add',18)} Klasör</button></div>`}
 else if(view.scope==='remind')h+=`<div class="fhead"><h2>Hatırlatıcılar</h2></div>`;

 else if(view.scope==='trash'){h+=`<div class="fhead"><h2>Çöp kutusu</h2><button class="btn ghost" data-act="empty">Boşalt</button></div><div class="hint">Çöp kutusundaki notlar kendiliğinden silinmez; yalnızca siz silerseniz silinir.</div>`}
 const l=visibleNotes();
 const inF=view.scope==='folder'&&!searching;
 if(inF){const f0=folderById(view.folderId),all=view.tab==='all',nf=files.filter(x=>!x.deleted&&x.folderId===f0.id).length;
  if(view.tab!=='files'){if(all)h+=`<div class="sec">Notlar (${l.length})</div>`;
   if(l.length){const pn=l.filter(n=>n.pinned),on=l.filter(n=>!n.pinned);if(pn.length)h+=`<div class="sec">Sabitlenenler</div><div class="notes ${S.layout}">${pn.map(cardHtml).join('')}</div>`;if(on.length){if(pn.length)h+=`<div class="sec">Diğerleri</div>`;h+=`<div class="notes ${S.layout}">${on.map(cardHtml).join('')}</div>`}}
   else h+=all?`<div class="hint">Bu klasörde henüz not yok.</div>`:`<div class="empty">${ic('notes',64)}<div>Henüz not yok.<br>Sağ alttaki + ile başlayın.</div></div>`}
  if(view.tab!=='notes'){if(all)h+=`<div class="sec" style="margin-top:18px">Dosyalar (${nf})</div>`;h+=(nf||!all)?renderFiles(f0):`<div class="hint">Bu klasörde henüz dosya yok. + ile PDF yükleyebilirsiniz.</div>`}
  m.innerHTML=h;return}
 if(!l.length)h+=`<div class="empty">${ic('notes',64)}<div>${searching?'Sonuç bulunamadı':view.scope==='trash'?'Çöp kutusu boş':view.scope==='remind'?'Hatırlatıcı yok.<br>Bir notun üstündeki zil simgesiyle ekleyebilirsiniz.':view.scope==='archive'?'Arşiv boş':'Henüz not yok.<br>Sağ alttaki + ile başlayın.'}</div></div>`;
 else{const act=!searching&&['all','folder'].includes(view.scope);const pn=act?l.filter(n=>n.pinned):[];const on=act?l.filter(n=>!n.pinned):l;
  if(pn.length)h+=`<div class="sec">Sabitlenenler</div><div class="notes ${S.layout}">${pn.map(cardHtml).join('')}</div>`;
  if(on.length){if(pn.length)h+=`<div class="sec">Diğerleri</div>`;h+=`<div class="notes ${S.layout}">${on.map(cardHtml).join('')}</div>`}}
 m.innerHTML=h}
function backupBanner(){const last=S.lastBackup||0,ch=notes.some(n=>!n.deleted&&n.updated>last);if(!ch||Date.now()-last<2*864e5||!notes.some(n=>!n.deleted))return '';
 const g=last?Math.floor((Date.now()-last)/864e5)+' gündür':'hiç';return `<div class="card2" style="display:flex;gap:12px;align-items:center;padding:12px 14px"><div style="flex:1;font-size:13.5px"><b>Yedek zamanı</b><br>Son yedeğinizden ${last?'bu yana '+g.replace(' gündür',' gün geçti'):'beri hiç yedek alınmadı'}. Yedek telefonunuzun İndirilenler klasörüne kaydedilir.</div><button class="btn" data-act="bk">Yedekle</button></div>`}
const KIND={icerik:'Kitap içeriği (PDF)',kapak:'Kapak (PDF)',diger:'Diğer dosyalar'};
function renderFiles(f){const l=files.filter(x=>!x.deleted&&x.folderId===f.id);
 if(!l.length)return `<div class="empty">${ic('file',64)}<div>Bu klasörde henüz dosya yok.<br>Biten kitabın içerik ve kapak PDF'lerini + ile yükleyin.</div></div>`;
 let h='';for(const k of Object.keys(KIND)){const g=l.filter(x=>x.kind===k).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(ord(a)-ord(b))||b.updated-a.updated);if(!g.length)continue;
  h+=`<div class="sec">${KIND[k]}</div><div class="fgrp">`+g.map(x=>`<div class="frow" data-id="${x.id}"><div class="fi">${ic('file')}</div><div class="ft" data-act="fopen" data-id="${x.id}"><b>${esc(x.name)}</b><small>${fsize(x.size)} · ${fdate(x.updated)}</small></div>${x.pinned?`<span style="color:var(--primary)">${ic('pin',18)}</span>`:''}<button class="icb" data-act="fmore" data-id="${x.id}">${ic('more')}</button></div>`).join('')+'</div>'}
 return h}
function renderDrawer(){const d=$('#drawer');const fs=folders.filter(f=>!f.deleted).sort(folderSort);
 const act=notes.filter(n=>!n.deleted&&n.state==='active').length,ar=notes.filter(n=>!n.deleted&&n.state==='archive').length,tr=notes.filter(n=>!n.deleted&&n.state==='trash').length;
 d.innerHTML=`<div class="dlogo">${LOGO}<span>Not Defteri</span></div>
 <button class="ditem ${view.scope==='all'?'on':''}" data-d="all">${ic('notes')}Tüm notlar<span class="n">${act}</span></button>
 <button class="ditem ${view.scope==='remind'?'on':''}" data-d="remind">${ic('bell')}Hatırlatıcılar<span class="n">${notes.filter(n=>!n.deleted&&n.state==='active'&&n.remind&&!n.rdone).length}</span></button>
 <div class="dsec">Klasörler<button class="icb" style="width:32px;height:32px" data-d="newfolder">${ic('add',20)}</button></div>
 ${fs.map(f=>`<button class="ditem ${view.scope==='folder'&&view.folderId===f.id?'on':''}" data-d="folder" data-id="${f.id}" style="${f.hex?chipStyle(f):''}"><span class="fdot" style="background:${f.hex?onCol(f.hex):fcol(f)}"></span>${esc(f.name)}<span class="n">${countIn(f.id)}</span></button>`).join('')}
 <hr><button class="ditem ${view.scope==='archive'?'on':''}" data-d="archive">${ic('archive')}Arşiv<span class="n">${ar}</span></button>
 <button class="ditem ${view.scope==='trash'?'on':''}" data-d="trash">${ic('delete')}Çöp kutusu<span class="n">${tr}</span></button>
 <button class="ditem" data-d="settings">${ic('settings')}Ayarlar</button>`}
function renderTop(){$('#hMenu').innerHTML=ic('menu');$('#hView').innerHTML=ic(S.layout==='grid'?'list':'grid');$('#hSort').innerHTML=ic('sort');
 const sy=$('#hSync');if(S.clientId){sy.style.display='';sy.innerHTML=ic('cloud')+`<span class="sdot ${syncState}"></span>`}else sy.style.display='none';
 const st=$('#selTop');st.classList.toggle('on',selecting);
 if(selecting){const inTrash=view.scope==='trash';st.innerHTML=`<button class="icb" data-s="cancel">${ic('close')}</button><b>${sel.size} seçili</b><button class="icb" data-s="all" title="Tümünü seç">${ic('selall')}</button>${inTrash?`<button class="icb" data-s="restore">${ic('restore')}</button><button class="icb" data-s="purge">${ic('delete')}</button>`:`<button class="icb" data-s="pin">${ic('pin')}</button><button class="icb" data-s="export" title="Dışa aktar / Gönder">${ic('download')}</button><button class="icb" data-s="more">${ic('more')}</button>`}`}
 const fab=$('#fab');const showFab=!selecting&&!q&&(view.scope==='all'||view.scope==='folder'||view.scope==='remind');fab.style.display=showFab?'grid':'none';if(!showFab&&fabOpen)closeFab();else fab.innerHTML=ic(fabOpen?'close':(view.scope==='folder'&&view.tab==='files'?'upload':'add'),28)}

let lpDone=false,dg=null;
const mainEl=$('#main');
function dragItem(t){let e=t.closest('.card[data-id]');if(e)return{el:e,type:'note',sel:'.card[data-id]'};e=t.closest('.fchip[data-id]');if(e)return{el:e,type:'folder',sel:'.fchip[data-id]'};e=t.closest('.frow[data-id]');if(e)return{el:e,type:'file',sel:'.frow[data-id]'};return null}
mainEl.addEventListener('pointerdown',e=>{if(dg||(e.pointerType==='mouse'&&e.button!==0))return;const it=dragItem(e.target);if(!it)return;lpDone=false;
 dg=Object.assign({},it,{id:it.el.dataset.id,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,armed:false,moved:false});dg.tm=setTimeout(armDrag,450)});
mainEl.addEventListener('contextmenu',e=>{if(dragItem(e.target))e.preventDefault()});
function armDrag(){const d=dg;if(!d)return;
 if(d.type==='note'&&(selecting||q||view.scope==='trash')){lpDone=true;dg=null;if(!selecting)selecting=true;toggleSel(d.id);if(navigator.vibrate)navigator.vibrate(15);return}
 d.armed=true;lpDone=true;if(navigator.vibrate)navigator.vibrate(15);
 const r=d.el.getBoundingClientRect();d.offX=d.x-r.left;d.offY=d.y-r.top;
 const g=d.el.cloneNode(true);g.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;margin:0;z-index:60;pointer-events:none;opacity:.92;transform:scale(1.05);box-shadow:0 12px 30px rgba(0,0,0,.35)';document.body.appendChild(g);d.ghost=g;d.el.style.opacity='.3';d.scT=setInterval(autoScroll,16)}
function clearMarks(){document.querySelectorAll('.dt-a,.dt-b').forEach(x=>x.classList.remove('dt-a','dt-b'))}
function updTarget(){const d=dg;if(!d||!d.armed)return;const el=document.elementFromPoint(d.x,d.y);const t=el&&el.closest(d.sel);if(!t||t===d.el||t.parentElement!==d.el.parentElement)return;
 clearMarks();const r=t.getBoundingClientRect();d.target=t;d.after=d.type==='folder'?d.x>r.left+r.width/2:d.y>r.top+r.height/2;t.classList.add(d.after?'dt-a':'dt-b')}
function autoScroll(){const d=dg;if(!d||!d.armed)return;let ch=false;if(d.y<150){mainEl.scrollTop-=14;ch=true}else if(d.y>innerHeight-150){mainEl.scrollTop+=14;ch=true}
 if(d.type==='folder'){const c=d.el.parentElement;if(d.x<60){c.scrollLeft-=14;ch=true}else if(d.x>innerWidth-60){c.scrollLeft+=14;ch=true}}if(ch)updTarget()}
document.addEventListener('pointermove',e=>{const d=dg;if(!d)return;d.x=e.clientX;d.y=e.clientY;
 if(!d.armed){if(Math.hypot(d.x-d.x0,d.y-d.y0)>10){clearTimeout(d.tm);dg=null}return}
 if(Math.hypot(d.x-d.x0,d.y-d.y0)>8)d.moved=true;d.ghost.style.left=(d.x-d.offX)+'px';d.ghost.style.top=(d.y-d.offY)+'px';updTarget()});
function endDrag(d){clearTimeout(d.tm);clearInterval(d.scT);if(d.ghost)d.ghost.remove();d.el.style.opacity='';clearMarks()}
document.addEventListener('pointerup',()=>{const d=dg;if(!d)return;dg=null;if(!d.armed){clearTimeout(d.tm);return}endDrag(d);
 if(d.moved&&d.target)dropItem(d);else if(!d.moved&&d.type==='note'&&!selecting){selecting=true;toggleSel(d.id)}});
document.addEventListener('pointercancel',()=>{const d=dg;if(!d)return;dg=null;endDrag(d)});
document.addEventListener('touchmove',e=>{if(dg&&dg.armed&&e.cancelable)e.preventDefault()},{passive:false});
mainEl.addEventListener('scroll',()=>{if(dg&&!dg.armed){clearTimeout(dg.tm);dg=null}},{passive:true});
function dropItem(d){const cont=d.el.parentElement;const ids=[...cont.querySelectorAll(d.sel)].map(x=>x.dataset.id).filter(i=>i!==d.id);let ti=ids.indexOf(d.target.dataset.id);if(d.after)ti++;ids.splice(ti,0,d.id);
 const arr=d.type==='note'?notes:d.type==='folder'?folders:files,put=d.type==='note'?putNote:d.type==='folder'?putFolder:putFile;
 ids.forEach((id,i)=>{const it=arr.find(x=>x.id===id);if(it&&it.order!==i*10){it.order=i*10;put(it)}});

 else if(a==='fmenu')folderMenu(folderById(view.folderId));

 else if(a==='rdone'){const nn=notes.find(x=>x.id===id);if(nn){remDone(nn);render()}}
 else if(a==='remlist')go({scope:'remind'});
 else if(a==='fopen')openFile(id);

$('#selTop').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;const a=b.dataset.s;const ids=[...sel];const ns=ids.map(i=>notes.find(n=>n.id===i)).filter(Boolean);

 else if(a==='export')exportDialog('Seçili notları dışa aktar / gönder',()=>[{folder:null,name:'Seçilen_notlar',notes:ns,files:[]}]);
 else if(a==='more')menu(`${ns.length} not`,[{ic:'folder',label:'Klasöre taşı',fn:()=>pickFolder('Taşınacak klasör',fid=>{ns.forEach(n=>{n.folderId=fid;putNote(n)});selecting=false;sel.clear();render();toast('Taşındı')},true)},{ic:'archive',label:'Arşivle',fn:()=>{ns.forEach(n=>{n.state='archive';putNote(n)});selecting=false;sel.clear();render()}},{ic:'delete',label:'Çöp kutusuna taşı',danger:1,fn:()=>{ns.forEach(n=>{n.state='trash';n.trashedAt=Date.now();putNote(n)});selecting=false;sel.clear();render();toast('Çöp kutusuna taşındı')}}]);

function trashMenu(n){menu(n.title||'Not',[{ic:'restore',label:'Geri yükle',fn:()=>{n.state='active';putNote(n);render()}},{ic:'delete',label:'Kalıcı olarak sil',danger:1,fn:async()=>{if(await confirmBox('Bu not kalıcı silinsin mi?')){purgeNote(n);render()}}}])}
async function emptyTrash(){const l=notes.filter(n=>!n.deleted&&n.state==='trash');if(!l.length)return;if(await confirmBox('Çöp kutusundaki '+l.length+' not kalıcı silinsin mi?','Boşalt')){l.forEach(purgeNote);render()}}

async function buildBackup(groups){const ns=[],fs=[],fo=new Map();
 for(const g of groups){if(g.folder)fo.set(g.folder.id,g.folder);g.notes.forEach(n=>{ns.push(n);if(n.folderId){const f=folderById(n.folderId);if(f)fo.set(f.id,f)}});(g.files||[]).forEach(f=>fs.push(f))}
 ns.forEach(n=>attOf(n.id).forEach(r=>fs.push(r)));const data={app:'notdefteri',version:1,exported:Date.now(),folders:[...fo.values()],notes:ns,files:fs};
 const ent=[{name:'veri.json',data:new TextEncoder().encode(JSON.stringify(data))}];
 for(const f of fs){const b=await idbGet('blobs',f.id);if(b)ent.push({name:'dosyalar/'+f.id,data:b})}
 return makeZip(ent)}
async function runExport(groups,o){const d=todayStr(),fmt=o.fmt;const all=groups.flatMap(g=>g.notes);const hasF=o.withFiles&&groups.some(g=>(g.files||[]).length);
 if(!all.length&&!hasF){toast('Dışa aktarılacak not yok');return}
 if(fmt==='pdf'){if(o.share)toast('PDF için açılan ekranda "PDF olarak kaydet"i seçin; sonra dosyayı paylaşabilirsiniz');printHtml(htmlDoc(all,o.indent,true,await noteImgData(all)));return}
 const out=[];let zipName=(groups.length===1?safe(groups[0].name):'NotDefteri')+'_'+d+'.zip';
 if(fmt==='yedek'){S.lastBackup=Date.now();saveS();out.push({name:'NotDefteri_Yedek_'+d+'.zip',blob:await buildBackup(groups.map(g=>({...g,files:o.withFiles?g.files:[]})))})}
 else{const multi=groups.length>1||hasF;const ext=EXT[fmt];
  for(const g of groups){if(!g.notes.length&&!(o.withFiles&&(g.files||[]).length))continue;const base=safe(g.name),pre=multi?base+'/':'';
   if(o.mode==='one'){if(g.notes.length)out.push({name:`${pre}${base}_${d}.${ext}`,blob:await renderNotes(g.notes,fmt,o.indent)})}
   else{const used=new Set();for(const n of g.notes){let nm=safe(n.title||n.body.split('\n')[0].slice(0,50)||'Not'),k=nm,i=2;while(used.has(k.toLowerCase()))k=nm+' ('+i++ +')';used.add(k.toLowerCase());out.push({name:`${pre}${k}.${ext}`,blob:await renderNotes([n],fmt,o.indent)})}}
   if(o.withFiles)for(const f of g.files||[]){const b=await idbGet('blobs',f.id);if(b)out.push({name:`${pre}Dosyalar/${safe(f.name)}`,blob:b})}}}
 if(!out.length){toast('Dışa aktarılacak içerik yok');return}
 let fin=out;if(out.length>1||out[0].name.includes('/'))fin=[{name:zipName,blob:await makeZip(out.map(x=>({name:x.name,data:x.blob})))}];
 if(o.share)await shareFiles(fin);else{fin.forEach(f=>dl(f.name,f.blob));toast('İndirildi: '+fin[0].name)}}
function exportDialog(title,getGroups){let fmt=S.lastFmt,mode=S.lastMode;const groups=getGroups();const anyF=groups.some(g=>(g.files||[]).length);
 const FM=[['docx','Word (.docx)'],['pdf','PDF'],['txt','Metin (.txt)'],['md','Markdown'],['html','HTML'],['yedek','Yedek (içe aktarılabilir ZIP)']];
 sheet(`<h3>${esc(title)}</h3><div class="hint">${groups.reduce((a,g)=>a+g.notes.length,0)} not${anyF?', '+groups.reduce((a,g)=>a+(g.files||[]).length,0)+' dosya':''}</div>
 <div class="lbl">Biçim</div><div class="chips" id="xf">${FM.map(([k,l])=>`<button data-v="${k}">${l}</button>`).join('')}</div>
 <div id="xmw"><div class="lbl">Dosya düzeni</div><div class="chips" id="xm"><button data-v="one">Tek dosyada birleştir</button><button data-v="zip">Her not ayrı dosya (ZIP)</button></div></div>
 ${anyF?`<label class="chk"><input type="checkbox" id="xFiles" ${S.xfiles?'checked':''}> Klasördeki PDF ve dosyaları da ekle</label>`:''}
 <label class="chk" id="xIw"><input type="checkbox" id="xInd" ${S.indent?'checked':''}> Paragraf ilk satır girintisi (Word/PDF/HTML)</label>
 <div class="row end"><button class="btn ghost" id="xShare">${ic('share',18)} Gönder</button><button class="btn" id="xGo">${ic('download',18)} İndir</button></div>`,s=>{
  const upd=()=>{s.querySelectorAll('#xf button').forEach(b=>b.classList.toggle('on',b.dataset.v===fmt));s.querySelectorAll('#xm button').forEach(b=>b.classList.toggle('on',b.dataset.v===mode));s.querySelector('#xmw').style.display=(fmt==='yedek'||fmt==='pdf')?'none':'';s.querySelector('#xIw').style.display=(fmt==='txt'||fmt==='md'||fmt==='yedek')?'none':''};
  s.querySelectorAll('#xf button').forEach(b=>b.onclick=()=>{fmt=b.dataset.v;upd()});s.querySelectorAll('#xm button').forEach(b=>b.onclick=()=>{mode=b.dataset.v;upd()});upd();
  const go=share=>{S.lastFmt=fmt;S.lastMode=mode;const xf=s.querySelector('#xFiles');if(xf)S.xfiles=xf.checked;S.indent=s.querySelector('#xInd').checked;saveS();const o={fmt,mode,share,indent:S.indent,withFiles:xf?xf.checked:false};closeSheet();runExport(getGroups(),o).catch(e=>toast('Hata: '+e.message))};
  s.querySelector('#xGo').onclick=()=>go(false);s.querySelector('#xShare').onclick=()=>go(true)})}

/* ============ İçe aktarma ============ */
async function mergeData(d,bl){bl=bl||{};let c=0;const L={folders,notes,files};
 for(const k of['folders','notes','files']){const idx=new Map(L[k].map((x,i)=>[x.id,i]));
  for(const it of(d[k]||[])){if(!it||!it.id)continue;const i=idx.get(it.id);
   if(i===undefined){L[k].push(it);idx.set(it.id,L[k].length-1);await idbPut(k,it);c++}
   else if((it.updated||0)>(L[k][i].updated||0)){L[k][i]=it;await idbPut(k,it);c++}
   else if(k==='files'&&!it.deleted&&bl[it.id]&&!await idbGet('blobs',it.id)){}
   if(k==='files'){if(it.deleted)await idbDel('blobs',it.id);else if(bl[it.id])await idbPut('blobs',bl[it.id],it.id)}}}
 return c}
async function importFiles(fl,fid){let created=0,merged=0,attached=0;
 for(const f of fl){const ext=(f.name.split('.').pop()||'').toLowerCase(),base=f.name.replace(/\.[^.]+$/,'');
  try{
   if(ext==='zip'){const z=await readZip(await f.arrayBuffer());const ve=z.entries.find(e=>e.name==='veri.json');
    if(ve){const data=JSON.parse(new TextDecoder().decode(await z.read(ve)));const bl={};for(const e of z.entries)if(e.name.startsWith('dosyalar/')&&e.name.length>9)bl[e.name.slice(9)]=new Blob([await z.read(e)]);merged+=await mergeData(data,bl)}
    else for(const e of z.entries){const x=e.name.split('.').pop().toLowerCase();if(e.name.endsWith('/'))continue;if(['txt','md','docx','html','htm'].includes(x)){const bytes=await z.read(e);created+=await noteFromBytes(e.name.split('/').pop().replace(/\.[^.]+$/,''),x,bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength),fid)}}}
   else if(ext==='json'){const data=JSON.parse(await f.text());if(data.app==='notdefteri')merged+=await mergeData(data);else throw new Error('Tanınmayan JSON')}
   else if(['txt','md','markdown','html','htm','docx'].includes(ext))created+=await noteFromBytes(base,ext,await f.arrayBuffer(),fid);
   else if(fid){const r={id:uid(),folderId:fid,kind:ext==='pdf'?'icerik':'diger',name:f.name,type:f.type||'application/octet-stream',size:f.size,pinned:false,created:Date.now(),updated:Date.now()};await idbPut('blobs',f,r.id);files.push(r);putFile(r);attached++}
   else toast(f.name+': PDF/dosyalar bir klasöre eklenir; önce klasör açın')
  }catch(e){toast(f.name+' içe aktarılamadı: '+e.message)}}
 render();toast([created?created+' not eklendi':'',merged?merged+' kayıt birleştirildi':'',attached?attached+' dosya eklendi':''].filter(Boolean).join(' · ')||'İçe aktarılacak bir şey bulunamadı')}
async function noteFromBytes(title,ext,buf,fid){let body,html='';
 if(ext==='docx'){const r=await parseDocx(buf);body=r.body;html=r.html}
 else{body=new TextDecoder('utf-8').decode(buf);if(ext==='html'||ext==='htm'){const d=new DOMParser().parseFromString(body,'text/html');html=cleanHtml(d.body.innerHTML);body=textOf(htmlBody(html))}}
 const n={id:uid(),folderId:fid||null,title,body,color:0,pinned:false,state:'active',created:Date.now(),updated:Date.now()};if(html)n.html=html;notes.push(n);putNote(n);return 1}

function closeSettingsUI(){$('#settings').classList.remove('on');render()}
async function renderSettings(){const e=$('#settings');let usage='';try{const es=await navigator.storage.estimate();usage=fsize(es.usage||0)}catch(x){}
 let pers='';try{pers=(await navigator.storage.persisted())?'Evet':'Hayır'}catch(x){pers='?'}

 e.innerHTML=`<div class="st-top"><button class="icb" data-s="back">${ic('back')}</button><h2>Ayarlar</h2></div><div class="st-body">
 <div class="card2"><h3>Görünüm</h3><div class="themes">${THEMES.map(([k,l,c,bg])=>`<button class="tsw ${S.theme===k?'on':''}" data-s="theme" data-v="${k}" style="background:linear-gradient(135deg,${bg} 50%,${c} 50%);border-color:${S.theme===k?'var(--ink)':'var(--line)'}" title="${l}">${S.theme===k?ic('check',22):''}</button>`).join('')}</div><div class="hint" style="padding-top:8px">${THEMES.find(x=>x[0]===S.theme)[1]}</div>
  <div class="srow"><span>Yazı boyutu: <b id="fsv">${S.fs}</b> px</span></div><input type="range" min="13" max="30" value="${S.fs}" id="fsr">
  <div class="srow"><span>Not görünümü</span><div class="chips"><button class="${S.layout==='grid'?'on':''}" data-s="layout" data-v="grid">Izgara</button><button class="${S.layout==='list'?'on':''}" data-s="layout" data-v="list">Liste</button></div></div>
  <label class="chk"><input type="checkbox" id="sInd" ${S.indent?'checked':''}> Dışa aktarırken paragraf ilk satır girintisi</label></div>
 <div class="card2"><h3>Yedekleme ve aktarma</h3><p>Tüm klasörleri Word, PDF, metin vb. biçimlerde dışa aktarabilir veya içe aktarılabilir tam yedek (ZIP) alabilirsiniz.</p>
  <button class="btn block" data-s="exportAll">${ic('download',18)} Tüm klasörleri dışa aktar / gönder</button>
  <button class="btn ghost block" data-s="backup">${ic('archive',18)} Tam yedek al (notlar + dosyalar, ZIP)</button>
  <button class="btn ghost block" data-s="import">${ic('upload',18)} İçe aktar (yedek, Word, metin…)</button></div>
 <div class="card2"><h3>Cihazlar arası eşitleme (Google hesabı)</h3>
  <p>Aynı Google hesabıyla bağlanan telefon ve tablette notlar, klasörler ve PDF dosyaları Google Drive'ın bu uygulamaya ayrılmış gizli alanı üzerinden eşitlenir. Bir kerelik kurulum gerekir (aşağıda).</p>
  <input class="inp" id="cid" placeholder="Google OAuth İstemci Kimliği (Client ID)" value="${esc(S.clientId)}">
  <div class="row"><button class="btn" data-s="connect" style="flex:1">${ic('cloud',18)} ${S.connected?'Şimdi eşitle':'Google ile bağlan'}</button>${S.connected?`<button class="btn ghost" data-s="disconnect">Kes</button>`:''}</div>
  <label class="chk"><input type="checkbox" id="sAuto" ${S.autosync?'checked':''}> Değişiklikleri otomatik eşitle</label>
  <p>Son eşitleme: ${last}</p>
  <details><summary style="cursor:pointer;color:var(--primary-d);font-weight:600">Kurulum adımları</summary><ol>
   <li>console.cloud.google.com adresinde yeni bir proje açın.</li>

   <li>"Credentials → Create credentials → OAuth client ID" → Türü <b>Web application</b>. "Authorized JavaScript origins" kısmına uygulamanın yayınlandığı adresi yazın (ör. <b>https://safrani01.github.io</b>).</li>
   <li>Oluşan <b>Client ID</b>'yi yukarıya yapıştırıp "Google ile bağlan"a basın. Aynısını tablette de yapın (Client ID'yi tabletteki uygulamaya da girin).</li></ol></details></div>
 <div class="card2"><h3>Uygulama</h3>
  ${deferredInstall?`<button class="btn block" data-s="install">Uygulamayı ana ekrana yükle</button>`:`<p>Yüklemek için tarayıcı menüsünden "Ana ekrana ekle" / "Uygulamayı yükle"yi seçin.</p>`}
  <p>Kullanılan alan: ${usage||'?'} · Kalıcı depolama: <b>${pers}</b>. Notlar bu cihazda sınırsız uzunlukta saklanır.</p>
  <p>Son yedek: <b>${S.lastBackup?new Date(S.lastBackup).toLocaleString('tr-TR'):'hiç alınmadı'}</b></p>
  <p>Tarayıcı geçmişini silerken "Çerezler ve site verileri"ni işaretlemezseniz notlar silinmez. Uygulamayı ana ekrana ekleyip kullanırsanız tarayıcı bu veriyi silmez. Yine de yedeği İndirilenler klasörüne alın veya Google eşitlemesini açın; bu iki kopya tarayıcıdan bağımsızdır.</p></div>
 <div style="text-align:center;color:var(--muted);font-size:12px;padding:10px">Not Defteri · sürüm 1.1</div></div>`;
 const r=$('#fsr');if(r)r.oninput=()=>{S.fs=+r.value;$('#fsv').textContent=S.fs;saveS()};
 $('#sInd').onchange=ev=>{S.indent=ev.target.checked;saveS()};$('#sAuto').onchange=ev=>{S.autosync=ev.target.checked;saveS()}}

 else if(a==='theme'){S.theme=b.dataset.v;saveS();applyTheme();renderSettings()}
 else if(a==='layout'){S.layout=b.dataset.v;saveS();renderSettings()}
 else if(a==='exportAll')exportDialog('Tüm klasörleri dışa aktar / gönder',allGroups);
 else if(a==='backup')runExport(allGroups(),{fmt:'yedek',withFiles:true,share:false}).catch(x=>toast(x.message));
 else if(a==='import')importFlow(view.scope==='folder'?view.folderId:null);
 else if(a==='connect'){S.clientId=$('#cid').value.trim();saveS();if(!S.clientId){toast('Önce Client ID girin');return}await syncNow(true);renderSettings();renderTop()}

 else if(a==='install'&&deferredInstall){deferredInstall.prompt();deferredInstall=null}};

/* ============ Google Drive eşitleme ============ */
let gToken=null,gExp=0,syncing=false,syncState='',syncT=null;
function setSyncState(s,msg){syncState=s;renderTop();if(s==='err')console.warn('sync',msg)}
function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('Google betiği yüklenemedi (internet var mı?)'));document.head.appendChild(s)})}
async function getToken(interactive){if(gToken&&Date.now()<gExp-60000)return gToken;if(!S.clientId)throw new Error('Client ID girilmemiş');await loadGIS();
 return new Promise((res,rej)=>{const c=google.accounts.oauth2.initTokenClient({client_id:S.clientId,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));gToken=r.access_token;gExp=Date.now()+(r.expires_in||3600)*1000;S.connected=true;saveS();res(gToken)},error_callback:er=>rej(new Error(er.type==='popup_closed'?'Giriş penceresi kapatıldı':(er.message||er.type||'Giriş hatası')))});
  c.requestAccessToken(interactive?{}:{prompt:''})})}
async function gf(url,opt){opt=opt||{};const t=await getToken(false);const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},opt.headers||{},{Authorization:'Bearer '+t})}));if(!r.ok)throw new Error('Drive '+r.status);return r}
async function gList(){let out=[],pt='';do{const r=await gf('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name)'+(pt?'&pageToken='+pt:''));const j=await r.json();out=out.concat(j.files||[]);pt=j.nextPageToken}while(pt);return out}
async function gUp(name,blob,id){if(id){await gf('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',body:blob});return}
 const bd='nd'+uid();const body=new Blob(['--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name,parents:['appDataFolder']})+'\r\n--'+bd+'\r\nContent-Type: application/octet-stream\r\n\r\n',blob,'\r\n--'+bd+'--']);
 await gf('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body})}
async function syncNow(interactive){if(syncing)return;syncing=true;setSyncState('run');
 try{await getToken(interactive);const remote=await gList();const map={};remote.forEach(f=>map[f.name]=f.id);
  if(map['veri.json']){const r=await gf('https://www.googleapis.com/drive/v3/files/'+map['veri.json']+'?alt=media');await mergeData(await r.json())}
  for(const f of files.slice()){const bn='blob_'+f.id;
   if(f.deleted){if(map[bn]){await gf('https://www.googleapis.com/drive/v3/files/'+map[bn],{method:'DELETE'});delete map[bn]}continue}
   const has=await idbGet('blobs',f.id);
   if(!has&&map[bn]){const r=await gf('https://www.googleapis.com/drive/v3/files/'+map[bn]+'?alt=media');await idbPut('blobs',await r.blob(),f.id)}
   else if(has&&!map[bn])await gUp(bn,has)}
  await gUp('veri.json',new Blob([JSON.stringify({app:'notdefteri',version:1,updated:Date.now(),folders,notes,files})],{type:'application/json'}),map['veri.json']);
  S.lastSync=Date.now();saveS();setSyncState('ok');if(!editorOpen)render();if(interactive)toast('Eşitlendi ✓')}
 catch(e){setSyncState('err',e.message);if(interactive)toast('Eşitleme hatası: '+e.message)}
 finally{syncing=false}}
function syncSoon(ms){if(!(S.clientId&&S.connected&&S.autosync))return;clearTimeout(syncT);syncT=setTimeout(()=>{if(!editorOpen||!dirty)syncNow(false);else syncSoon(4000)},ms||7000)}

render();remCheck();setInterval(remCheck,30000);

})();
